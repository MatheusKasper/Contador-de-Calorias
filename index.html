<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calorias</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121110">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121110;--card:#1c1a18;--line:#2e2a26;--tx:#efe9e2;--mut:#9a9088;--ac:#c8854a;--ok:#8fb573;--bad:#d9604c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1ea;--card:#fff;--line:#e3d9cc;--tx:#2a2420;--mut:#7a6e63;--ac:#a8631f;--ok:#4f7a35;--bad:#b8402e;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0;flex:1}h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
button{cursor:pointer}.pri{background:var(--ac);color:#fff;border:0;width:100%;font-weight:600}
.ghost{background:none;border:0;color:var(--mut);padding:4px 8px}
.row{display:flex;gap:8px;margin-bottom:8px}.row input:first-child{flex:1;min-width:0}#qty{width:72px}
.top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:128px;height:128px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#big{font-size:28px;font-weight:700}#sub{font-size:11px;color:var(--mut)}
.mac{flex:1}.mac div{margin-bottom:8px;font-size:13px}.bar{height:6px;background:var(--line);border-radius:4px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:6px}.item span:first-child{flex:1}.item small{color:var(--mut)}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li span{flex:1}.li small{color:var(--mut);display:block}
.hist{display:flex;gap:6px;align-items:flex-end;height:90px}.hist div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.hist i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:12px;color:var(--mut)}.grid input,.grid select{width:100%}
summary{cursor:pointer;font-weight:600}.msg{color:var(--mut);font-size:14px;padding:6px 0}
[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Hoje</h1><span id="dt" class="msg"></span></header>

<section class="card top">
 <div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="64" cy="64" r="52" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round"/></svg>
 <div><span id="big">0</span><span id="sub"></span></div></div>
 <div class="mac" id="mac"></div>
</section>

<section class="card">
 <div class="row"><input id="q" placeholder="Buscar ou digitar alimento…" autocomplete="off"><input id="qty" type="number" value="1" min="0.25" step="0.25" aria-label="Quantidade"></div>
 <button id="cam" class="pri">📷 Foto do prato</button><input type="file" id="f" accept="image/*" capture="environment" hidden>
 <div id="res" style="margin-top:10px"></div>
 <div id="man" hidden>
  <div class="grid"><div><label>kcal</label><input id="mk" type="number" inputmode="decimal"></div><div><label>Proteína (g)</label><input id="mp" type="number" inputmode="decimal"></div><div><label>Carbo (g)</label><input id="mc" type="number" inputmode="decimal"></div><div><label>Gordura (g)</label><input id="mf" type="number" inputmode="decimal"></div></div>
  <button id="madd" class="pri" style="margin-top:8px">Adicionar</button>
 </div>
</section>

<section class="card"><h2>Refeições de hoje</h2><div id="list"></div></section>
<section class="card"><h2>Últimos 7 dias</h2><div class="hist" id="hist"></div></section>

<details class="card" id="cfg"><summary>Minha meta</summary>
 <div class="grid" style="margin-top:10px">
  <div><label>Sexo</label><select id="sx"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
  <div><label>Idade</label><input id="id" type="number" inputmode="numeric"></div>
  <div><label>Peso (kg)</label><input id="pe" type="number" inputmode="decimal"></div>
  <div><label>Altura (cm)</label><input id="al" type="number" inputmode="numeric"></div>
  <div><label>Atividade</label><select id="at"><option value="1.2">Sedentário</option><option value="1.375">Leve (1–3×/sem)</option><option value="1.55" selected>Moderada (3–5×/sem)</option><option value="1.725">Intensa (6–7×/sem)</option></select></div>
  <div><label>Objetivo</label><select id="ob"><option value="-400">Perder peso</option><option value="0" selected>Manter</option><option value="300">Ganhar massa</option></select></div>
 </div>
 <button id="calc" style="margin:10px 0;width:100%">Calcular meta</button>
 <div class="grid"><div><label>kcal/dia</label><input id="gk" type="number"></div><div><label>Proteína (g)</label><input id="gp" type="number"></div><div><label>Carbo (g)</label><input id="gc" type="number"></div><div><label>Gordura (g)</label><input id="gf" type="number"></div></div>
 <button id="gs" class="pri" style="margin-top:10px">Salvar meta</button>
 <p class="msg">Estimativa pela fórmula de Mifflin-St Jeor. Para metas específicas, fale com um nutricionista.</p>
</details>
</main>
<div id="camv" hidden style="position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column"><video id="vid" playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div style="display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))"><button id="xcam" style="flex:1">Cancelar</button><button id="shot" class="pri" style="flex:2">📷 Tirar foto</button></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
// [nome, porção, kcal, proteína, carbo, gordura]
const FOODS=[["Arroz branco cozido","100 g",128,2.5,28,.2],["Feijão cozido","100 g",76,4.8,13.6,.5],["Peito de frango grelhado","100 g",159,32,0,2.5],["Carne bovina grelhada","100 g",220,30,0,10],["Ovo cozido","1 un",78,6,.6,5.3],["Ovo mexido","1 un",95,6.5,.7,7],["Pão francês","1 un (50 g)",150,4.7,29,1.6],["Pão de forma","2 fatias",130,4,24,1.5],["Pão de queijo","1 un (30 g)",95,2,10,5],["Tapioca","1 un (50 g)",170,0,42,0],["Queijo mussarela","2 fatias (30 g)",100,7,.7,7.5],["Presunto","2 fatias (30 g)",45,5,.5,2.5],["Leite integral","200 ml",122,6.4,9.4,6.6],["Iogurte natural","170 g",105,7,9,4],["Café sem açúcar","1 xícara",5,.3,.8,0],["Banana","1 un",90,1.1,23,.3],["Maçã","1 un",70,.4,19,.2],["Laranja","1 un",62,1.2,15,.2],["Batata cozida","100 g",52,1.2,12,0],["Batata frita","100 g",312,3.4,41,15],["Macarrão cozido","100 g",158,5.8,31,.9],["Aveia","30 g",117,4,20,2],["Whey protein","1 scoop (30 g)",120,24,3,1.5],["Pizza","1 fatia",270,11,33,10],["Hambúrguer","1 un",300,15,30,13],["Salada de alface e tomate","1 prato",25,1.5,5,.2],["Refrigerante","1 lata",140,0,35,0],["Suco de laranja","200 ml",90,1.4,21,.4],["Chocolate","25 g",135,1.5,14,8],["Açaí","200 g",250,3,30,13]];
let S=null;try{S=JSON.parse(localStorage.getItem("cal")||"null")}catch(e){}
S=S||{g:{k:2000,p:120,c:240,f:60},days:{},rec:[]};
const save=()=>{try{localStorage.setItem("cal",JSON.stringify(S))}catch(e){}};
const key=(d)=>(d||new Date()).toLocaleDateString("sv");
const day=()=>S.days[key()]||(S.days[key()]=[]);
const r1=n=>Math.round(n*10)/10;
let pending=[];

function add(n,por,k,p,c,f,m){
  m=m||1;
  day().push({n:(m!==1?m+"× ":"")+n,k:Math.round(k*m),p:r1(p*m),c:r1(c*m),f:r1(f*m)});
  S.rec=[[n,por,k,p,c,f]].concat(S.rec.filter(x=>x[0]!==n)).slice(0,8);
  save();$("#q").value="";$("#qty").value=1;$("#man").hidden=true;$("#res").innerHTML="";render();showRes();
}
function render(){
  const L=day(),g=S.g,t=L.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
  const left=g.k-t.k,C=2*Math.PI*52,arc=$("#arc");
  arc.style.strokeDasharray=C;arc.style.strokeDashoffset=C*(1-Math.min(t.k/g.k,1));arc.style.stroke=left<0?"var(--bad)":"var(--ac)";
  $("#big").textContent=Math.abs(Math.round(left));$("#sub").textContent=left>=0?"kcal restantes":"kcal acima da meta";
  $("#dt").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"})+" · "+Math.round(t.k)+"/"+g.k;
  $("#mac").innerHTML=[["Proteína",t.p,g.p],["Carbo",t.c,g.c],["Gordura",t.f,g.f]].map(m=>`<div>${m[0]} <b>${Math.round(m[1])}</b>/${m[2]} g<div class="bar"><i style="width:${Math.min(m[1]/m[2]*100,100)}%"></i></div></div>`).join("");
  $("#list").innerHTML=L.length?L.map((x,i)=>`<div class="li"><span>${esc(x.n)}<small>P ${x.p} · C ${x.c} · G ${x.f}</small></span><b>${x.k}</b><button class="ghost" data-del="${i}" aria-label="Remover">✕</button></div>`).join(""):'<div class="msg">Nada registrado ainda.</div>';
  let h="";for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=key(d),tot=(S.days[k]||[]).reduce((a,x)=>a+x.k,0);
    h+=`<div><i style="height:${Math.min(tot/g.k,1.2)*70}px${tot>g.k?";background:var(--bad)":""}"></i>${d.toLocaleDateString("pt-BR",{weekday:"short"}).slice(0,3)}</div>`}
  $("#hist").innerHTML=h;
}
function showRes(){
  const q=norm($("#q").value.trim()),box=$("#res");
  let rows=q?FOODS.filter(f=>norm(f[0]).includes(q)).slice(0,6):S.rec.slice(0,5);
  let html=rows.map((f,i)=>`<button class="item" data-i="${i}"><span>${esc(f[0])} <small>${esc(f[1])}</small></span><small>${f[2]} kcal</small></button>`).join("");
  if(!q&&rows.length)html='<div class="msg">Recentes</div>'+html;
  if(q)html+=`<button class="item" data-manual="1"><span>＋ Criar “${esc($("#q").value.trim())}” manualmente</span></button>`;
  box.innerHTML=html;box._rows=rows;
}
$("#q").addEventListener("input",()=>{$("#man").hidden=true;showRes()});
$("#res").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.manual){$("#man").hidden=false;$("#mk").focus();return}
  if(b.dataset.ph){const x=pending[+b.dataset.ph];add(x.nome,x.porcao||"",x.kcal,x.p,x.c,x.f,1);pending.splice(+b.dataset.ph,1);return}
  if(b.dataset.all){pending.forEach(x=>add(x.nome,x.porcao||"",x.kcal,x.p,x.c,x.f,1));pending=[];return}
  const f=$("#res")._rows[+b.dataset.i];if(f)add(f[0],f[1],f[2],f[3],f[4],f[5],parseFloat($("#qty").value)||1);
});
$("#madd").onclick=()=>{
  const k=parseFloat($("#mk").value);if(!(k>=0))return $("#mk").focus();
  add($("#q").value.trim()||"Item","",k,parseFloat($("#mp").value)||0,parseFloat($("#mc").value)||0,parseFloat($("#mf").value)||0,parseFloat($("#qty").value)||1);
  ["#mk","#mp","#mc","#mf"].forEach(s=>$(s).value="");
};
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;day().splice(+b.dataset.del,1);save();render()});

// Foto do prato
const PROMPT="Você é nutricionista. Identifique cada alimento visível nesta foto de refeição e estime porção e valores nutricionais. Responda SOMENTE JSON, sem texto extra: {\"itens\":[{\"nome\":\"...\",\"porcao\":\"ex: 150 g\",\"kcal\":0,\"p\":0,\"c\":0,\"f\":0}]}. p, c, f são gramas de proteína, carboidrato e gordura. Nomes em português. Se não houver comida, retorne {\"itens\":[]}.";
async function shrink(file){
  const bmp=await createImageBitmap(file),s=Math.min(1,800/Math.max(bmp.width,bmp.height)),cv=document.createElement("canvas");
  cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,"image/jpeg",.8));
}
let stream=null;
const stopCam=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("#camv").hidden=true};
$("#cam").onclick=async()=>{
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const v=$("#vid");v.srcObject=stream;$("#camv").hidden=false;await v.play();
  }catch(e){stopCam();$("#f").click()}
};
$("#shot").onclick=()=>{
  const v=$("#vid");if(!v.videoWidth)return;
  const s=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement("canvas");
  cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
  cv.toBlob(b=>{stopCam();if(b)analyze(b)},"image/jpeg",.8);
};
$("#xcam").onclick=stopCam;
$("#f").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)analyze(f)};
async function analyze(file){
  $("#res").innerHTML='<div class="msg">Analisando a foto…</div>';
  try{
    const sample=await claude.use("sample");if(!sample)throw 0;
    const d=await sample.json(PROMPT,{images:[await shrink(file)],modelTier:"quick"});
    pending=(d.itens||[]).filter(x=>x&&x.nome&&isFinite(x.kcal)).map(x=>({nome:String(x.nome),porcao:String(x.porcao||""),kcal:+x.kcal,p:+x.p||0,c:+x.c||0,f:+x.f||0}));
    if(!pending.length){$("#res").innerHTML='<div class="msg">Não identifiquei comida. Tente outra foto ou busque pelo nome.</div>';return}
    $("#res").innerHTML='<div class="msg">Estimativa pela foto (confira as porções):</div>'+pending.map((x,i)=>`<button class="item" data-ph="${i}"><span>${esc(x.nome)} <small>${esc(x.porcao)}</small></span><small>${Math.round(x.kcal)} kcal ＋</small></button>`).join("")+`<button class="pri" data-all="1" style="margin-top:4px">Adicionar tudo</button>`;
  }catch(err){$("#res").innerHTML='<div class="msg">Não consegui analisar a foto agora. Busque ou digite o alimento.</div>'}
};

// Meta
function fillCfg(){const p=S.pr||{};["sx","id","pe","al","at","ob"].forEach(k=>{if(p[k]!=null)$("#"+k).value=p[k]});$("#gk").value=S.g.k;$("#gp").value=S.g.p;$("#gc").value=S.g.c;$("#gf").value=S.g.f}
$("#calc").onclick=()=>{
  const w=+$("#pe").value,h=+$("#al").value,a=+$("#id").value;if(!(w&&h&&a))return;
  const m=$("#sx").value==="m",bmr=10*w+6.25*h-5*a+(m?5:-161);
  const k=Math.max(Math.round(bmr*$("#at").value+ +$("#ob").value),m?1500:1200),p=Math.round(1.8*w),f=Math.round(.8*w);
  $("#gk").value=k;$("#gp").value=p;$("#gf").value=f;$("#gc").value=Math.max(Math.round((k-4*p-9*f)/4),0);
};
$("#gs").onclick=()=>{
  S.pr={};["sx","id","pe","al","at","ob"].forEach(k=>S.pr[k]=$("#"+k).value);
  S.g={k:+$("#gk").value||2000,p:+$("#gp").value||0,c:+$("#gc").value||0,f:+$("#gf").value||0};
  save();$("#cfg").open=false;render();
};
(async()=>{try{if(!(await claude.use("sample")))$("#cam").hidden=true}catch(e){$("#cam").hidden=true}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
fillCfg();$("#cfg").open=!S.pr;render();showRes();
</script></body></html>
